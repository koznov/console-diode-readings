<?xml version="1.0" encoding="UTF-8"?>
<!--
  HDMI Type-A connector template (19 pins).
  Consumer: js/pinmap.mjs clones this SVG, then colors/styles each .pad-group
  according to its data-pin and the loaded board's signal class + reading.
  Styling is driven by CSS variables (--sig-*) and classes defined in css/style.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="HDMI connector pinout">
  <title>HDMI Type-A Connector</title>

  <!-- Connector body silhouette -->
  <rect class="body" x="20" y="20" width="220" height="120" rx="8" ry="8"/>

  <!-- Pin 1 corner indicator -->
  <polygon class="pin1-marker" points="20,20 36,20 20,36"/>
  <text class="marker-label" x="44" y="30">PIN 1</text>

  <!-- Row A: pins 1..10 (top row, left to right) -->
  <g class="pad-group" data-pin="1">
    <rect class="pad" x="52"  y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="59"  y="78">1</text>
  </g>
  <g class="pad-group" data-pin="2">
    <rect class="pad" x="72"  y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="79"  y="78">2</text>
  </g>
  <g class="pad-group" data-pin="3">
    <rect class="pad" x="92"  y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="99"  y="78">3</text>
  </g>
  <g class="pad-group" data-pin="4">
    <rect class="pad" x="112" y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="119" y="78">4</text>
  </g>
  <g class="pad-group" data-pin="5">
    <rect class="pad" x="132" y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="139" y="78">5</text>
  </g>
  <g class="pad-group" data-pin="6">
    <rect class="pad" x="152" y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="159" y="78">6</text>
  </g>
  <g class="pad-group" data-pin="7">
    <rect class="pad" x="172" y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="179" y="78">7</text>
  </g>
  <g class="pad-group" data-pin="8">
    <rect class="pad" x="192" y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="199" y="78">8</text>
  </g>
  <g class="pad-group" data-pin="9">
    <rect class="pad" x="212" y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="219" y="78">9</text>
  </g>
  <g class="pad-group" data-pin="10">
    <rect class="pad" x="232" y="44" width="14" height="22" rx="2"/>
    <text class="pad-label" x="235" y="78">10</text>
  </g>

  <!-- Row B: pins 11..19 (bottom row, mirrored so pin 11 sits under pin 10) -->
  <g class="pad-group" data-pin="11">
    <rect class="pad" x="222" y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="225" y="134">11</text>
  </g>
  <g class="pad-group" data-pin="12">
    <rect class="pad" x="202" y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="209" y="134">12</text>
  </g>
  <g class="pad-group" data-pin="13">
    <rect class="pad" x="182" y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="189" y="134">13</text>
  </g>
  <g class="pad-group" data-pin="14">
    <rect class="pad" x="162" y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="169" y="134">14</text>
  </g>
  <g class="pad-group" data-pin="15">
    <rect class="pad" x="142" y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="149" y="134">15</text>
  </g>
  <g class="pad-group" data-pin="16">
    <rect class="pad" x="122" y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="129" y="134">16</text>
  </g>
  <g class="pad-group" data-pin="17">
    <rect class="pad" x="102" y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="109" y="134">17</text>
  </g>
  <g class="pad-group" data-pin="18">
    <rect class="pad" x="82"  y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="89"  y="134">18</text>
  </g>
  <g class="pad-group" data-pin="19">
    <rect class="pad" x="62"  y="98" width="14" height="22" rx="2"/>
    <text class="pad-label" x="69"  y="134">19</text>
  </g>
</svg>
