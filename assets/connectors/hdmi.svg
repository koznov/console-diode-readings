<?xml version="1.0" encoding="UTF-8"?>
<!--
  HDMI Type-A connector footprint (19 pads) as seen on the board with the
  connector removed: a single row, pin 19 at the LEFT and pin 1 at the RIGHT.
  Consumer: js/pinmap.mjs clones this SVG, then colors each .pad-group by its
  data-pin and the loaded board's signal class, and writes the measured value
  into the empty .pad-value slot so every reading is visible at once; the
  .pad-value-adj slot below it carries the meter-calibrated figure when set.
  Styling is driven by CSS variables (--sig-*) and classes in css/style.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 162" role="group" aria-label="HDMI connector footprint, 19 pads">
  <!-- Deliberately no SVG title element: browsers render it as a native tooltip on top of ours. -->

  <!-- Board outline / connector keep-out -->
  <rect class="body" x="8" y="8" width="724" height="146" rx="10" ry="10"/>

  <!-- Orientation hints: pin 19 on the left, pin 1 on the right -->
  <text class="marker-label" x="20" y="24">PIN 19</text>
  <polygon class="pin1-marker" points="732,8 712,8 732,28"/>
  <text class="marker-label marker-right" x="704" y="24">PIN 1</text>

  <g class="pad-group" data-pin="19">
    <rect class="pad" x="32" y="52" width="20" height="36" rx="3"/>
    <text class="pad-label" x="42.0" y="44">19</text>
    <text class="pad-value" x="42.0" y="106"></text>
    <text class="pad-value-adj" x="42.0" y="120"></text>
    <polygon class="pad-caret" points="37.0,134 47.0,134 42.0,128"/>
  </g>
  <g class="pad-group" data-pin="18">
    <rect class="pad" x="68" y="52" width="20" height="36" rx="3"/>
    <text class="pad-label" x="78.0" y="44">18</text>
    <text class="pad-value" x="78.0" y="106"></text>
    <text class="pad-value-adj" x="78.0" y="120"></text>
    <polygon class="pad-caret" points="73.0,134 83.0,134 78.0,128"/>
  </g>
  <g class="pad-group" data-pin="17">
    <rect class="pad" x="104" y="52" width="20" height="36" rx="3"/>
