<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console Diode Readings — Admin</title>
  <link rel="stylesheet" href="admin.css">
  <!-- Apply the site's stored theme before paint so admin matches the viewer -->
  <script>
    (function () {
      try { var t = localStorage.getItem('cdr:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="nav"><!-- populated by main.mjs --></aside>
    <main class="main">
      <nav class="crumbs" id="crumbs"></nav>
      <section class="content" id="content">
        <div id="welcome"><h1>Admin</h1><p>Loading…</p></div>
      </section>
    </main>
  </div>
  <div id="toasts"></div>
  <script type="module" src="js/main.mjs"></script>
</body>
</html>
